  <main>
    <section class="contact-section">
      <div class="contact-box">
        <h1>CONTACT ME</h1>

        <form class="contact-form">
          <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" required>
          </div>

          <div class="form-row">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="janedoe@gmail.com" required>
          </div>

          <div class="form-row">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Opportunities" required>
          </div>

          <div class="form-row">
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Hi" required></textarea>
          </div>

          <div class="form-buttons">
            <button type="button">Submit</button>
            <button type="reset">Reset Form</button>
          </div>
        </form>
      </div>
    </section>
  </main>
